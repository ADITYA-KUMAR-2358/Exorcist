[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exorcist"
version = "0.1.0"
description = "A local-first CLI for finding and banishing possessed code"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "GitPython>=3.1,<4",
  "Jinja2>=3.1,<4",
  "ollama>=0.3,<1",
  "pydantic>=2,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "vulture>=2.11,<3"]

[project.scripts]
exorcist = "exorcist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["exorcist"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
